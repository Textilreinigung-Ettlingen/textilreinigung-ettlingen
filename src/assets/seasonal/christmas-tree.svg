    <path d="M128 40Q120 67 91 103l12-3-5 8 15-4-2 6 17-5 10 4 12-4 13 2-4-6 11 2Q142 72 128 40Z"/>
    <path d="M128 25q-5 19-23 42l11-3-2 5 13-5 11 5-2-5 12 3q-15-19-20-42Z"/>
