<svg xmlns="http://www.w3.org/2000/svg" width="240" height="248" viewBox="0 0 240 248" fill="none">
  <title>Weihnachtsmann auf der Leiter am geschmückten Tannenbaum</title>
  <style>
    .climber { animation: climb 8s ease-in-out infinite alternate; }
    @keyframes climb {
      0%, 8% { transform: translate(0, 0); }
      26% { transform: translate(5px, -15px); }
      48% { transform: translate(10px, -30px); }
      70% { transform: translate(15px, -45px); }
      92%, 100% { transform: translate(20px, -60px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .climber { animation: none; transform: translate(10px, -30px); }
    }
  </style>
  <defs>
    <linearGradient id="fir" x1="0" x2="1" y1="0" y2=".65" gradientUnits="objectBoundingBox">
      <stop stop-color="#234f45"/><stop offset=".48" stop-color="#376151"/><stop offset="1" stop-color="#193b35"/>
    </linearGradient>
    <linearGradient id="coat" x2="1" y2=".6">
      <stop stop-color="#7e2936"/><stop offset=".65" stop-color="#bd504b"/><stop offset="1" stop-color="#dd7161"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#f8d990" stop-opacity=".38"/><stop offset="1" stop-color="#e4b46b" stop-opacity="0"/>
    </radialGradient>
    <g id="candle"><circle r="5" fill="#ffd47a" opacity=".12"/><circle r="1.8" fill="#ffe4a0"/></g>
    <g id="bauble"><path d="M0 -6v3" stroke="#dac69b"/><circle r="3.5" fill="#b55049"/><circle cx="-1" cy="-1" r=".9" fill="#f3b69a"/></g>
  </defs>
  <ellipse cx="124" cy="228" rx="88" ry="5" fill="#d2e2da" opacity=".09"/>
  <path d="M122 198h16l-2 28h-13z" fill="#694d39"/>
