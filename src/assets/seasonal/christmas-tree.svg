    <path d="M114 66q17 13 33 11M101 101q22 15 54 11M89 147q36 21 81 5M79 188q44 22 100 8"/>
  </g>
  <g>
    <use href="#candle" x="116" y="67"/><use href="#candle" x="137" y="76"/>
    <use href="#candle" x="105" y="103"/><use href="#candle" x="125" y="111"/><use href="#candle" x="148" y="113"/>
