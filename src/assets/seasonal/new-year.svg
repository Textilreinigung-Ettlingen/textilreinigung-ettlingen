<svg xmlns="http://www.w3.org/2000/svg" width="240" height="248" viewBox="0 0 240 248" fill="none">
  <title>Goldenes Feuerwerk zum Jahreswechsel 2027</title>
  <style>
    .burst { transform-box: fill-box; transform-origin: center; animation: shimmer 5s ease-in-out infinite alternate; }
    .small { animation-delay: -3s; }
    @keyframes shimmer { from { opacity: .63; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .burst { animation: none; } }
  </style>
  <defs>
    <g id="ray" stroke-linecap="round">
      <path d="M0-12q-2-11-1-19m0-7 1-5" stroke="#e4c284" stroke-width="1.55"/>
      <path d="m5-18 3-8" stroke="#fff2cd" stroke-width=".9"/>
      <circle cy="-48" r="1.45" fill="#f1d59d"/>
    </g>
    <g id="spray">
      <use href="#ray"/><use href="#ray" transform="rotate(30)"/><use href="#ray" transform="rotate(60)"/>
      <use href="#ray" transform="rotate(90)"/><use href="#ray" transform="rotate(120)"/><use href="#ray" transform="rotate(150)"/>
      <use href="#ray" transform="rotate(180)"/><use href="#ray" transform="rotate(210)"/><use href="#ray" transform="rotate(240)"/>
      <use href="#ray" transform="rotate(270)"/><use href="#ray" transform="rotate(300)"/><use href="#ray" transform="rotate(330)"/>
    </g>
    <path id="glint" d="m0-6 1.5 4.5L6 0 1.5 1.5 0 6-1.5 1.5-6 0l4.5-1.5Z" fill="#fff0ca"/>
    <linearGradient id="foil" x2=".25" y2="1"><stop stop-color="#fff5cf"/><stop offset=".55" stop-color="#eacc8b"/><stop offset="1" stop-color="#b68e59"/></linearGradient>
  </defs>
  <g transform="translate(143 74) scale(1.13)"><g class="burst"><use href="#spray"/></g></g>
  <g transform="translate(66 108) scale(.65) rotate(-13)"><g class="burst small"><use href="#spray"/></g></g>
  <g stroke="#cba974" stroke-linecap="round"><path d="M103 144q18-17 33-50m-43 50q-6-13-17-23" stroke-dasharray="3 5"/></g>
  <use href="#glint" transform="translate(66 48) scale(.68)"/><use href="#glint" transform="translate(190 122) scale(.65)"/>
  <use href="#glint" transform="translate(203 57) scale(.48)"/><use href="#glint" transform="translate(42 144) scale(.4)"/>
  <text x="120" y="196" text-anchor="middle" fill="url(#foil)" font-family="Georgia, 'Times New Roman', serif" font-size="63" letter-spacing="2">2027</text>
  <path d="M64 211q25 3 49 0m14 0q25 3 49 0" stroke="#c4a476" stroke-width="1"/>
  <use href="#glint" transform="translate(120 212) scale(.7)"/>
</svg>
